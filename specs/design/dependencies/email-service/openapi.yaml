components:
    examples:
        MailBatch2xx:
            summary: A mail batch ID.
            value:
                batch_id: 123abc456def789hij0
    parameters:
        BatchId:
            description: Set this parameter to the batch ID that's associated with the mail send you want to retrieve.
            in: path
            name: batch_id
            required: true
            schema:
                type: string
        MailBodyCompression:
            description: Use this header when sending a gzip compressed mail body. Mail body compression is available to some high volume accounts. Submit a [request to support](https://support.sendgrid.com/hc/en-us) to have gzip enabled on your account.
            in: header
            name: Content-Encoding
            required: false
            schema:
                $ref: '#/components/schemas/ContentEncoding'
                type: string
        OnBehalfOf:
            description: Use the `on-behalf-of` header to make API calls for a particular Subuser through the parent account. You can use this header to automate bulk updates or to administer a Subuser without changing the authentication in your code. You will use the parent account's API key when using this header.
            in: header
            name: on-behalf-of
            required: false
            schema:
                type: string
    requestBodies:
        PostMailSend:
            content:
                application/json:
                    examples:
                        MailSendDynamicTemplate:
                            description: A Mail Send request that uses a SendGrid Dynamic Template.
                            value:
                                asm:
                                    group_id: 12345
                                    groups_to_display:
                                        - 12345
                                attachments:
                                    - content: 
                                      disposition: attachment
                                      filename: index.html
                                      type: text/html
                                batch_id: AsdFgHjklQweRTYuIopzXcVBNm0aSDfGHjklmZcVbNMqWert1znmOP2asDFjkl
                                categories:
                                    - cake
                                    - pie
                                    - baking
                                from:
                                    email: orders@example.com
                                    name: Example Order Confirmation
                                ip_pool_name: transactional email
                                mail_settings:
                                    bypass_list_management:
                                        enable: false
                                    footer:
                                        enable: false
                                    sandbox_mode:
                                        enable: false
                                personalizations:
                                    - dynamic_template_data:
                                        confirmation_number: 123abc456def789hij0
                                        customer_name: Alex
                                        subject: Hello, Alex
                                      to:
                                        - email: alex@example.com
                                          name: Alex
                                        - email: bola@example.com
                                          name: Bola
                                reply_to:
                                    email: customer_service@example.com
                                    name: Example Customer Service Team
                                send_at: 1617260400
                                template_id: d-123abc456def789hij0klm123nop456qrs789tuv0xyz
                                tracking_settings:
                                    click_tracking:
                                        enable: true
                                        enable_text: false
                                    open_tracking:
                                        enable: true
                                        substitution_tag: '%open-track%'
                                    subscription_tracking:
                                        enable: false
                        MailSendNoTemplate:
                            description: A Mail Send request with directly included content and no template.
                            value:
                                asm:
                                    group_id: 12345
                                    groups_to_display:
                                        - 12345
                                attachments:
                                    - content: 
                                      disposition: attachment
                                      filename: index.html
                                      type: text/html
                                batch_id: AsdFgHjklQweRTYuIopzXcVBNm0aSDfGHjklmZcVbNMqWert1znmOP2asDFjkl
                                categories:
                                    - cake
                                    - pie
                                    - baking
                                content:
                                    - type: text/html
                                      value: <p>Hello from Twilio SendGrid!</p><p>Sending with the email service trusted by developers and marketers for <strong>time-savings</strong>, <strong>scalability</strong>, and <strong>delivery expertise</strong>.</p><p>%open-track%</p>
                                from:
                                    email: orders@example.com
                                    name: Example Order Confirmation
                                ip_pool_name: transactional email
                                mail_settings:
                                    bypass_list_management:
                                        enable: false
                                    footer:
                                        enable: false
                                    sandbox_mode:
                                        enable: false
                                personalizations:
                                    - bcc:
                                        - email: dana@example.com
                                          name: Dana
                                      cc:
                                        - email: charlie@example.com
                                          name: Charlie
                                      to:
                                        - email: alex@example.com
                                          name: Alex
                                        - email: bola@example.com
                                          name: Bola
                                    - bcc:
                                        - email: lee@example.com
                                          name: Lee
                                      from:
                                        email: sales@example.com
                                        name: Example Sales Team
                                      to:
                                        - email: ira@example.com
                                          name: Ira
                                reply_to:
                                    email: customer_service@example.com
                                    name: Example Customer Service Team
                                send_at: 1617260400
                                subject: Your Example Order Confirmation
                                tracking_settings:
                                    click_tracking:
                                        enable: true
                                        enable_text: false
                                    open_tracking:
                                        enable: true
                                        substitution_tag: '%open-track%'
                                    subscription_tracking:
                                        enable: false
                    schema:
                        properties:
                            asm:
                                description: An object allowing you to specify how to handle unsubscribes. With SendGrid, an unsubscribe is the action an email recipient takes when they opt-out of receiving your messages. A suppression is the action you take as a sender to filter or suppress an unsubscribed address from your email send. From the perspective of the recipient, your suppression is the result of their unsubscribe. See [**Suppression Groups**](https://www.twilio.com/docs/sendgrid/api-reference/suppressions-unsubscribe-groups/create-a-new-suppression-group) for more information.
                                properties:
                                    group_id:
                                        description: The unsubscribe group to associate with this email. See the [Suppressions API](https://docs.sendgrid.com/api-reference/suppressions/) to manage unsubscribe group IDs.
                                        type: integer
                                    groups_to_display:
                                        description: An array containing the unsubscribe groups that you would like to be displayed to a recipient on the unsubscribe preferences page. This page is displayed in the recipient's browser when they click the unsubscribe link in your message.
                                        items:
                                            type: integer
                                        maxItems: 25
                                        type: array
                                required:
                                    - group_id
                                type: object
                            attachments:
                                description: An array of objects where you can define any attachments to be included with the message. Each object contains a `content` property, which must be a Base64 encoded string of the attachment itself, and `type`, `filename`, `disposition`, and `content_id` properties that tell SendGrid how to handle the attachment.
                                items:
                                    properties:
                                        content:
                                            description: The Base64 encoded content of the attachment.
                                            minLength: 1
                                            type: string
                                        content_id:
                                            description: The attachment's content ID. The `content_id` is used when the `disposition` is set to `inline` and the attachment is an image, allowing the file to be displayed within the body of the email.
                                            type: string
                                        disposition:
                                            $ref: '#/components/schemas/Disposition'
                                            default: attachment
                                            description: The attachment's content-disposition specifies how you would like the attachment to be displayed. For example, `inline` results in the attached file being displayed automatically within the message while `attachment` results in the attached file requiring some action to be taken before it is displayed such as opening or downloading the file.
                                            type: string
                                        filename:
                                            description: The attachment's filename, including the file extension.
                                            type: string
                                        type:
                                            description: The MIME type of the content you are attaching (e.g., `image/jpeg` or `application/pdf`).
                                            minLength: 1
                                            type: string
                                    required:
                                        - content
                                        - filename
                                    type: object
                                type: array
                            batch_id:
                                description: An ID representing a batch of emails to be sent at the same time. Including a `batch_id` in your request allows you to include this email in that batch. It also enables you to cancel or pause the delivery of that batch. See the [Scheduled Sends API](https://sendgrid.com/docs/api-reference/) for more information about scheduling your email.
                                type: string
                            categories:
                                description: An array of category names assigned to this message. Categories allow you to group messages by categories you define. Categories should be used sparingly to create general groups that are relevant to you. Categories are not meant to be used to track individual mail sends. For more granular categorization and tracking, use the `custom_args` property. A category name cannot exceed 255 characters. See [**Working with Categories**](https://docs.sendgrid.com/for-developers/sending-email/categories) for more information.
                                items:
                                    maxLength: 255
                                    type: string
                                maxItems: 10
                                type: array
                                uniqueItems: true
                            content:
                                description: An array of objects, each containing a message body's content and [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types). You must specify at least one MIME type and may include multiple. To include more than one MIME type, add an object for each type to the array.
                                items:
                                    properties:
                                        type:
                                            description: The MIME type of the content assigned in the `value` property of this object (e.g., `text/plain` or `text/html`).
                                            minLength: 1
                                            type: string
                                        value:
                                            description: The content of your message in the specified MIME type assigned in the `type` property of this object.
                                            minLength: 1
                                            type: string
                                    required:
                                        - type
                                        - value
                                    type: object
                                type: array
                            custom_args:
                                description: Values that are specific to the entire send that will be carried along with the email and its activity data. Substitutions will not be made on custom arguments, so any string that is assigned to this property will be assumed to be the custom argument that you would like to be used. This parameter is overridden by `custom_args` set at the personalizations level. Total `custom_args` size may not exceed 10,000 bytes.
                                type: string
                            from:
                                $ref: '#/components/schemas/MailFrom'
                            headers:
                                description: 'A collection of JSON property name and property value pairs allowing you to specify handling instructions for your email. You may not override the following headers: `x-sg-id`, `x-sg-eid`, `received`, `dkim-signature`, `Content-Type`, `Content-Transfer-Encoding`, `To`, `From`, `Subject`, `Reply-To`, `CC`, `BCC`.'
                                type: object
                            ip_pool_name:
                                description: The IP Pool that you would like to send this email from. IP Pools allow you to group your dedicated Twilio SendGrid IP addresses in order to have more control over your deliverability. See [**IP Pools**](https://docs.sendgrid.com/ui/account-and-settings/ip-pools) for more information.
                                maxLength: 64
                                minLength: 2
                                type: string
                            mail_settings:
                                description: A collection of different mail settings that you can use to specify how you would like this email to be handled. Mail settings provide extra functionality to your mail send. See [**Mail Settings**](https://docs.sendgrid.com/ui/account-and-settings/mail) for more information.
                                properties:
                                    bypass_bounce_management:
                                        description: Allows you to bypass the bounce list to ensure that the email is delivered to recipients. Spam report and unsubscribe lists will still be checked; addresses on these other lists will not receive the message. This filter cannot be combined with the `bypass_list_management` filter. See the [the "Bypass suppressions" section of our **Suppressions Overview**](https://sendgrid.com/docs/ui/sending-email/index-suppressions/#bypass-suppressions) for more about bypass filters.
                                        properties:
                                            enable:
                                                description: Indicates if this setting is enabled.
                                                type: boolean
                                        type: object
                                    bypass_list_management:
                                        description: Allows you to bypass all unsubscribe groups and suppressions to ensure that the email is delivered to every single recipient. This should only be used in emergencies when it is absolutely necessary that every recipient receives your email. This filter cannot be combined with any other bypass filters. See the [the "Bypass suppressions" section of our **Suppressions Overview**](https://sendgrid.com/docs/ui/sending-email/index-suppressions/#bypass-suppressions) for more about bypass filters.
                                        properties:
                                            enable:
                                                description: Indicates if this setting is enabled.
                                                type: boolean
                                        type: object
                                    bypass_spam_management:
                                        description: Allows you to bypass the spam report list to ensure that the email is delivered to recipients. Bounce and unsubscribe lists will still be checked; addresses on these other lists will not receive the message. This filter cannot be combined with the `bypass_list_management` filter. See the [the "Bypass suppressions" section of our **Suppressions Overview**](https://sendgrid.com/docs/ui/sending-email/index-suppressions/#bypass-suppressions) for more about bypass filters.
                                        properties:
                                            enable:
                                                description: Indicates if this setting is enabled.
                                                type: boolean
                                        type: object
                                    bypass_unsubscribe_management:
                                        description: Allows you to bypass the global unsubscribe list to ensure that the email is delivered to recipients. Bounce and spam report lists will still be checked; addresses on these other lists will not receive the message. This filter applies only to global unsubscribes and will not bypass group unsubscribes. This filter cannot be combined with the `bypass_list_management` filter. See the [the "Bypass suppressions" section of our **Suppressions Overview**](https://sendgrid.com/docs/ui/sending-email/index-suppressions/#bypass-suppressions) for more about bypass filters.
                                        properties:
                                            enable:
                                                description: Indicates if this setting is enabled.
                                                type: boolean
                                        type: object
                                    footer:
                                        description: Inserts a custom footer at the bottom of the text and HTML bodies of your messages. Use the `html` and `text` properties to include the content of the footers to be inserted.
                                        properties:
                                            enable:
                                                description: Indicates if this setting is enabled.
                                                type: boolean
                                            html:
                                                description: The HTML content of your footer.
                                                type: string
                                            text:
                                                description: The plain text content of your footer.
                                                type: string
                                        type: object
                                    sandbox_mode:
                                        description: Sandbox Mode allows you to send a test email to ensure that your request body is valid and formatted correctly.
                                        properties:
                                            enable:
                                                description: Indicates if this setting is enabled.
                                                type: boolean
                                        type: object
                                type: object
                            personalizations:
                                description: An array of messages and their metadata. Each object within the `personalizations` array can be thought of as a mail envelope—it defines who should receive an individual message and how that message should be handled. See [**Personalizations**](https://sendgrid.com/docs/for-developers/sending-email/personalizations/) for more information.
                                items:
                                    properties:
                                        bcc:
                                            description: An array of recipients to whom a blind carbon copy of your email will be sent. Each object in this array must contain a recipient's email address. Each object in the array may optionally contain a recipient's name.
                                            items:
                                                $ref: '#/components/schemas/MailTo'
                                            maxItems: 1000
                                            type: array
                                        cc:
                                            description: An array of recipients to whom a copy of the email will be sent. Each object in this array must contain a recipient's email address. Each object in the array may optionally contain a recipient's name.
                                            items:
                                                $ref: '#/components/schemas/MailTo'
                                            maxItems: 1000
                                            type: array
                                        custom_args:
                                            description: Values that are specific to this personalization that will be carried along with the email and its activity data. Substitutions will not be made on custom arguments, so any string that is assigned to this property will be assumed to be the custom argument that you would like to be used. This field may not exceed 10,000 bytes.
                                            maxProperties: 10000
                                            type: object
                                        dynamic_template_data:
                                            description: A collection property names that will be substituted by their corresponding property values in the `subject`, `reply-to` and `content` portions of a SendGrid Dynamic Template. Dynamic template data is available in a template using [Handlebars](https://docs.sendgrid.com/for-developers/sending-email/using-handlebars) syntax. This property should be used in combination with a Dynamic Template, which can be identified by a `template_id` starting with `d-`. See [**How to Send an Email with Dynamic Templates**](https://docs.sendgrid.com/ui/sending-email/how-to-send-an-email-with-dynamic-templates) for more information.
                                            type: object
                                        from:
                                            $ref: '#/components/schemas/MailFrom'
                                        headers:
                                            description: 'A collection of JSON property name and property value pairs allowing you to specify handling instructions for your email. You may not override the following headers: `x-sg-id`, `x-sg-eid`, `received`, `dkim-signature`, `Content-Type`, `Content-Transfer-Encoding`, `To`, `From`, `Subject`, `Reply-To`, `CC`, `BCC`.'
                                            type: object
                                        send_at:
                                            description: A [unix timestamp](https://en.wikipedia.org/wiki/Unix_time) allowing you to specify when your email should be sent. A send cannot be scheduled more than 72 hours in advance.
                                            type: integer
                                        subject:
                                            description: The subject of your email. See line length limits specified in [RFC 2822](https://www.rfc-editor.org/rfc/rfc2822#section-2.1.1) for guidance on subject line character limits.
                                            minLength: 1
                                            type: string
                                        substitutions:
                                            additionalProperties:
                                                type: string
                                            description: A collection property names that will be substituted by their corresponding property values in the `subject`, `reply-to` and `content` portions of your message. Name and value pairs follow the pattern `"substitution_tag":"value to substitute"`. The total collective size of your substitutions may not exceed 10,000 bytes per personalization object. Substitutions allow you to insert data without using SendGrid's Dynamic Templates. This property should not be used in combination with a Dynamic Template, which can be identified by a `template_id` starting with `d-`. See [**Substitution Tags**](https://docs.sendgrid.com/for-developers/sending-email/substitution-tags) for more information.
                                            maxProperties: 10000
                                            type: object
                                        to:
                                            description: An array of recipients to whom the email will be sent. Each object in this array must contain a recipient's email address. Each object in the array may optionally contain a recipient's name.
                                            items:
                                                $ref: '#/components/schemas/MailTo'
                                            type: array
                                    required:
                                        - to
                                    type: object
                                maxItems: 1000
                                type: array
                                uniqueItems: false
                            reply_to:
                                $ref: '#/components/schemas/MailTo'
                            reply_to_list:
                                description: An array of recipients to whom replies will be sent. Each object in this array must contain a recipient's email address. Each object in the array may optionally contain a recipient's name. You can use either the `reply_to` property or `reply_to_list` property but not both.
                                items:
                                    $ref: '#/components/schemas/MailTo'
                                maxItems: 1000
                                type: array
                                uniqueItems: true
                            send_at:
                                description: A [unix timestamp](https://en.wikipedia.org/wiki/Unix_time) allowing you to specify when your email should be sent. A send cannot be scheduled more than 72 hours in advance. This property may be overridden by the `send_at` property set at the personalizations level.
                                type: integer
                            subject:
                                description: The global or _message level_ subject of your email. Subject lines set in personalizations objects will override this global subject line. See line length limits specified in [RFC 2822](https://www.rfc-editor.org/rfc/rfc2822#section-2.1.1) for guidance on subject line character limits.
                                minLength: 1
                                type: string
                            template_id:
                                description: An email template ID. A template that contains a subject and content—either text or html—will override any subject and content values specified at the `personalizations` or message level. If a template ID begins with `d-`, it is a dynamic template and will work with the `dynamic_template_data` property. If the template ID does not begin with `d-`, it is a standard SendGrid template and will work with the `substitutions` property. See [**How to Send an Email with Dynamic Templates**](https://docs.sendgrid.com/ui/sending-email/how-to-send-an-email-with-dynamic-templates) for more information about working with templates.
                                type: string
                            tracking_settings:
                                description: Settings to determine how you would like to track the metrics of how your recipients interact with your email. See [**Tracking Settings**](https://docs.sendgrid.com/ui/account-and-settings/tracking) for more information.
                                properties:
                                    click_tracking:
                                        description: Allows you to track if a recipient clicked a link in your email.
                                        properties:
                                            enable:
                                                description: Indicates if this setting is enabled.
                                                type: boolean
                                            enable_text:
                                                description: Indicates if this setting should be included in the `text/plain` portion of your email.
                                                type: boolean
                                        type: object
                                    ganalytics:
                                        description: Allows you to enable tracking provided by Google Analytics. See [**Google Analytics and SendGrid Statistics**](https://docs.sendgrid.com/ui/analytics-and-reporting/google-analytics) for more information about this property.
                                        properties:
                                            enable:
                                                description: Indicates if this setting is enabled.
                                                type: boolean
                                            utm_campaign:
                                                description: The name of the campaign.
                                                type: string
                                            utm_content:
                                                description: Used to differentiate your campaign from advertisements.
                                                type: string
                                            utm_medium:
                                                description: Name of the marketing medium. (e.g., Email)
                                                type: string
                                            utm_source:
                                                description: Name of the referrer source. (e.g., Google, SomeDomain.com, or Marketing Email)
                                                type: string
                                            utm_term:
                                                description: Used to identify any paid keywords.
                                                type: string
                                        type: object
                                    open_tracking:
                                        description: Allows you to track if the email was opened by including a single transparent pixel image in the body of the message content. When the message is opened, a request for the pixel is sent. That request indicates to Twilio SendGrid that the message was opened.
                                        properties:
                                            enable:
                                                description: Indicates if this setting is enabled.
                                                type: boolean
                                            substitution_tag:
                                                description: Allows you to specify a substitution tag that you can insert in the body of your email at a location that you desire. This tag will be replaced by the open tracking pixel.
                                                type: string
                                        type: object
                                    subscription_tracking:
                                        description: Allows you to insert a subscription management link at the bottom of the text and HTML bodies of your email. If you would like to specify the location of the link within your email, you may use the `substitution_tag` property.
                                        properties:
                                            enable:
                                                description: Indicates if this setting is enabled.
                                                type: boolean
                                            html:
                                                description: HTML to be appended to the email with the subscription tracking link.
                                                type: string
                                            substitution_tag:
                                                description: A tag that will be replaced with the unsubscribe URL. If this property is used, it will override both the `text` and `html` properties. The URL of the link will be placed at the substitution tag's location in the message body with no additional formatting.
                                                type: string
                                            text:
                                                description: Text to be appended to the email with the subscription tracking link.
                                                type: string
                                        type: object
                                type: object
                        required:
                            - personalizations
                            - from
                        type: object
    responses:
        MailBatch2xx:
            content:
                application/json:
                    examples:
                        Success:
                            $ref: '#/components/examples/MailBatch2xx'
                    schema:
                        $ref: '#/components/schemas/MailBatchResponse'
            description: Batch ID success response.
        MailBatch400:
            content:
                application/json:
                    examples:
                        Bad request:
                            value:
                                errors:
                                    - field: "null"
                                      message: invalid batch id
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Batch ID bad response.
        MailBatch401:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: authorization required
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Batch ID unauthorized response.
        MailBatch403:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: access forbidden
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Batch ID forbidden response.
        MailBatch404:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: batch id not found
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Batch ID not found response.
        MailBatch405:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: method not allowed
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Get batch ID method not allowed response.
        MailBatch500:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: internal server error
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Get batch ID internal server error response.
        PostMailSend400:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: invalid request
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send bad response.
        PostMailSend401:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: authorization required
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send unauthorized response.
        PostMailSend403:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: access forbidden
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send forbidden response.
        PostMailSend404:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: not found
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send not found response.
        PostMailSend405:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: method not allowed
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send method not allowed response.
        PostMailSend413:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - field: "null"
                                      message: content too large
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send content too large response.
        PostMailSend500:
            content:
                application/json:
                    examples:
                        Unauthorized request:
                            value:
                                errors:
                                    - message: internal server error
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail send internal server error response.
    schemas:
        ContentEncoding:
            enum:
                - gzip
            type: string
        Disposition:
            enum:
                - inline
                - attachment
            type: string
        ErrorResponse:
            example:
                errors:
                    - field: field_name
                      message: error message
            properties:
                errors:
                    items:
                        properties:
                            field:
                                description: When applicable, this property value will be the field that generated the error.
                                nullable: true
                                type: string
                            help:
                                description: When applicable, this property value will be helper text or a link to documentation to help you troubleshoot the error.
                                type: object
                            message:
                                description: An error message.
                                type: string
                        type: object
                    type: array
                id:
                    description: When applicable, this property value will be an error ID.
                    type: string
            type: object
        MailBatchResponse:
            example:
                batch_id: HkJ5yLYULb7Rj8GKSx7u025ouWVlMgAi
            properties:
                batch_id:
                    description: A mail batch ID.
                    type: string
            title: Mail Batch and Batch ID Response Schema
            type: object
        MailFrom:
            properties:
                email:
                    description: The email address from which messages are sent. This address should be a verified sender in your Twilio SendGrid account. Email addresses specified in `personalizations` will override addresses set at the message level outside of the `personalizations` object.
                    format: email
                    type: string
                name:
                    description: A name or title associated with the email address such as "Support" or "Alex".
                    type: string
            required:
                - email
            title: From Email Object
            type: object
        MailTo:
            properties:
                email:
                    description: An email address to which a message is sent. Email addresses specified in `personalizations` will override addresses set at the message level outside of the `personalizations` object.
                    format: email
                    type: string
                name:
                    description: A name or title associated with the email address such as "Alex".
                    type: string
            required:
