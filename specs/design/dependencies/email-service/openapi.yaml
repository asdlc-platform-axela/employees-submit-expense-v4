externalDocs:
    description: Twilio SendGrid's official developer documentation.
    url: https://www.twilio.com/docs/sendgrid
info:
    contact:
        name: Twilio SendGrid Support
        url: https://support.sendgrid.com/hc/en-us
    description: The Twilio SendGrid v3 Mail API allows you to send email at scale over HTTP. The Mail Send endpoint supports many levels of functionality, allowing you to send templates, set categories and custom arguments that can be used to analyze your send, and configure which tracking settings to include such as opens and clicks. You can also group mail sends into batches, allowing you to schedule and cancel sends by their batch IDs.
    license:
        name: MIT
        url: https://code.hq.twilio.com/twilio/sendgrid-oas/blob/main/LICENSE
    summary: The Twilio SendGrid v3 Mail API allows you to send email at scale over HTTP. You can also group mail sends into batches.
    termsOfService: https://www.twilio.com/legal/tos
    title: Twilio SendGrid Mail API
    version: 1.0.0
    x-sendgrid:
        libraryPackage: mail
openapi: 3.1.0
paths:
    /v3/mail/batch:
        post:
            description: |
                **This operation allows you to generate a new mail batch ID.**


                Once a batch ID is created, you can associate it with a mail send by passing
                it in the request body of the [Mail Send operation](https://docs.sendgrid.com/api-reference/mail-send/mail-send).
                This makes it possible to group multiple requests to the Mail Send operation
                by assigning them the same batch ID.


                A batch ID that's associated with a mail send can be used to access and modify the associated send. For example, you can pause or cancel a send using its batch ID. See the [Scheduled Sends API](https://www.twilio.com/docs/sendgrid/api-reference/cancel-scheduled-sends) for more information about pausing and cancelling a mail send.
            operationId: CreateMailBatch
            parameters:
                - $ref: '#/components/parameters/OnBehalfOf'
            responses:
                "201":
                    $ref: '#/components/responses/MailBatch2xx'
                "400":
                    $ref: '#/components/responses/MailBatch400'
                "401":
                    $ref: '#/components/responses/MailBatch401'
                "403":
                    $ref: '#/components/responses/MailBatch403'
                "404":
                    $ref: '#/components/responses/MailBatch404'
                "405":
                    $ref: '#/components/responses/MailBatch405'
                "500":
                    $ref: '#/components/responses/MailBatch500'
            summary: Create a batch ID.
            tags:
                - Mail Batch
    /v3/mail/batch/{batch_id}:
        get:
            description: |-
                **This operation allows you to validate a mail batch ID.**

                If you provide a valid batch ID, this operation will return a `200` status code and the batch ID itself.
                If you provide an invalid batch ID, you will receive a `400` level status code and an error message.
                A batch ID does not need to be assigned to a send to be considered valid. A successful response means only that the batch ID has been created, but it does not indicate that the ID has been assigned to a send.
            operationId: GetMailBatch
            parameters:
                - $ref: '#/components/parameters/OnBehalfOf'
            responses:
                "200":
                    $ref: '#/components/responses/MailBatch2xx'
                "400":
                    $ref: '#/components/responses/MailBatch400'
                "401":
                    $ref: '#/components/responses/MailBatch401'
                "403":
                    $ref: '#/components/responses/MailBatch403'
                "405":
                    $ref: '#/components/responses/MailBatch405'
                "500":
                    $ref: '#/components/responses/MailBatch500'
            summary: Validate a batch ID.
            tags:
                - Mail Batch
        parameters:
            - $ref: '#/components/parameters/BatchId'
    /v3/mail/send:
        post:
            description: |
                *The Mail Send operation allows you to send email over SendGrid's v3 Web API*

                For an overview of this API, including its features and limitations, please see the [Mail Send API overview page](https://www.twilio.com/docs/sendgrid/api-reference/mail-send)

                The overview page also includes links to SendGrid's Email API quickstarts and helper libraries to get you working with this endpoint even faster.
            operationId: SendMail
            parameters:
                - $ref: '#/components/parameters/MailBodyCompression'
            requestBody:
                $ref: '#/components/requestBodies/PostMailSend'
            responses:
                "202":
                    description: Accepted
                "400":
                    $ref: '#/components/responses/PostMailSend400'
                "401":
                    $ref: '#/components/responses/PostMailSend401'
                "403":
                    $ref: '#/components/responses/PostMailSend403'
                "404":
                    $ref: '#/components/responses/PostMailSend404'
                "405":
                    $ref: '#/components/responses/PostMailSend405'
                "413":
                    $ref: '#/components/responses/PostMailSend413'
                "500":
                    $ref: '#/components/responses/PostMailSend500'
            summary: Send Email with Twilio SendGrid.
            tags:
                - Mail Send
